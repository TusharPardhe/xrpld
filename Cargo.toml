[workspace]
members = [
    "xrpl/basics",
    "xrpl/core",
    "xrpl/resource",
    "xrpl/protocol",
    "xrpl/shamap",
    "xrpld/acquisition",
    "xrpld/app",
    "xrpld/consensus",
    "xrpld/core",
    "xrpld/perflog",
    "xrpld/ledger",
    "xrpld/nodestore",
    "xrpld/overlay",
    "xrpld/rdb",
    "xrpld/server",
    "xrpld/rpc",
    "xrpld/rpc-integration-tests",
    "xrpld/tx",
    "xrpld/cli",
    "xrpld/main",
    "xrpld/metrics",
]
resolver = "2"

[workspace.package]
# Single release source for every Quaxar workspace crate and the protocol
# version advertised through server_info and peer handshakes.
version = "0.8.1"
